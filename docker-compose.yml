services:
  db:
    image: mysql:8
    environment:
      MYSQL_USER: agro
      MYSQL_PASSWORD: agro
      MYSQL_DATABASE: agrometrica
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3307:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagro", "-pagro"]
      interval: 5s
      retries: 20
volumes:
  dbdata:
